[mod]
id = "older_servers"
version = "2.0.0"
priority = 100

# Pinned: besides the native hook points it reaches inside Horizon here, all of
# which must be re-checked before moving the pin:
# - net::older_servers_enabled, net::older_server (connection: which version);
# - item::older_layout (1.21.11's EitherHolder item components);
# - multiplayer::ping_all (the list's ping, for the version tags) and the
#   `older_servers_rows` module in multiplayer.rs (where Screen::draw puts a row,
#   the Edit screen's address);
# - game::debug_lines::Game::debug_entry_lines (the F3 line);
# - Game's private `title` field, read by screen.rs and mouse.rs.
[compatibility]
horizon_revision = "66f3981f522b24c250b21523a70080965b940424"

# Seçim, ayarlar, sunucu başına sürümler; ekran ve bağlantı kodu paylaşır.
[[module]]
id = "state"
file = "crates/horizon-client/src/net.rs"
name = "older_servers_mod"
source = "state.rs"
visibility = "pub"



# Sunucu satırlarının yeri ve Edit/Add Server'daki adres (iç erişim).
[[module]]
id = "rows"
file = "crates/horizon-client/src/multiplayer.rs"
name = "older_servers_rows"
source = "rows.rs"
visibility = "pub"

# ViaFabricPlus's release list (names, dates, update names, icons).
[[module]]
id = "catalog"
file = "crates/horizon-client/src/net.rs"
name = "older_servers_catalog"
source = "catalog.rs"
visibility = "pub"

# ViaFabricPlus's screens: state, geometry, events.
[[module]]
id = "vfp"
file = "crates/horizon-client/src/net.rs"
name = "older_servers_vfp"
source = "vfp.rs"
visibility = "pub"

# ViaFabricPlus's screens drawn with the game's widgets (reads Game's gui and title).
[[module]]
id = "vfp_draw"
file = "crates/horizon-client/src/game/native_hooks.rs"
name = "older_servers_vfp_draw"
source = "vfp_draw.rs"

# Older servers are on without HORIZON_OLDER_SERVERS.
[[injection]]
id = "enabled"
kind = "HEAD"
cancellable = true
target = "horizon_client_lib::net::older_servers_enabled"
helper = "enabled.rs"
bindings = []

# Sunucuya sabit > seçim > ping (otomatik algılama).
[[injection]]
id = "server"
kind = "HEAD"
cancellable = true
target = "horizon_client_lib::net::older_server"
helper = "server.rs"
bindings = [
  { name = "address", ty = "&str", value = "address" },
]

# Sunucu listesi ping'lenirken protokoller (sürüm etiketleri).
[[injection]]
id = "ping"
kind = "HEAD"
target = "horizon_client_lib::multiplayer::ping_all"
helper = "ping.rs"
bindings = [
  { name = "servers", ty = "&[ServerEntry]", value = "servers" },
]

# 1.21.11's EitherHolder item components (horizon-rust/horizon#9752).
[[injection]]
id = "either"
kind = "HEAD"
cancellable = true
target = "horizon_protocol::item::older_layout"
helper = "either.rs"
bindings = [
  { name = "kind", ty = "i32", value = "kind" },
  { name = "r", ty = "&mut Reader", value = "&mut *r" },
]

[[injection]]
id = "frame"
hook = "frame"
hook_version = 1
kind = "HEAD"
helper = "frame.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

# Multiplayer: buton, etiketler, panel. Edit/Add Server: sunucu başına sürüm.
[[injection]]
id = "screen"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_screen_render_post"
helper = "screen.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "batch", ty = "&mut horizon_client::hud::HudBatch", value = "&mut *batch" },
  { name = "screen", ty = "&crate::game::native_hooks::NativeScreenView<'_>", value = "screen" },
]

[[injection]]
id = "mouse"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_screen_mouse_button_pressed_pre"
helper = "mouse.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "screen", ty = "&crate::game::native_hooks::NativeScreenView<'_>", value = "screen" },
  { name = "button", ty = "i32", value = "button" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

[[injection]]
id = "scroll"
hook = "screen_mouse_scrolled_pre"
hook_version = 1
kind = "HEAD"
helper = "scroll.rs"
bindings = [
  { name = "screen", ty = "&crate::game::native_hooks::NativeScreenView<'_>", value = "screen" },
  { name = "scroll", ty = "[f64; 2]", value = "scroll" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

[[injection]]
id = "keys"
hook = "screen_key_pressed_pre"
hook_version = 1
kind = "HEAD"
helper = "keys.rs"
bindings = [
  { name = "screen", ty = "&crate::game::native_hooks::NativeScreenView<'_>", value = "screen" },
  { name = "key", ty = "&str", value = "key" },
  { name = "modifiers", ty = "u32", value = "modifiers" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

[[injection]]
id = "chars"
hook = "screen_char_typed_pre"
hook_version = 1
kind = "HEAD"
helper = "chars.rs"
bindings = [
  { name = "c", ty = "char", value = "c" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

[[injection]]
id = "drag"
hook = "screen_mouse_dragged_pre"
hook_version = 1
kind = "HEAD"
helper = "drag.rs"
bindings = [
  { name = "screen", ty = "&crate::game::native_hooks::NativeScreenView<'_>", value = "screen" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

[[injection]]
id = "released"
hook = "screen_mouse_button_released_pre"
hook_version = 1
kind = "HEAD"
helper = "released.rs"
bindings = [
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

# F3 satırı.
[[injection]]
id = "debug"
kind = "HEAD"
target = "horizon_client::game::debug_lines::Game<'_>::debug_entry_lines"
helper = "debug.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "d", ty = "&mut Displayer", value = "&mut *d" },
]

[[injection]]
id = "list"
hook = "mods"
hook_version = 1
kind = "HEAD"
helper = "list.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]

# Options > Mods > Older Servers ayarları.
[[injection]]
id = "settings"
hook = "settings"
hook_version = 1
kind = "HEAD"
helper = "settings.rs"
bindings = [
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "buttons", ty = "&mut Vec<String>", value = "&mut *buttons" },
]

[[injection]]
id = "settings_click"
hook = "settings_click"
hook_version = 1
kind = "HEAD"
helper = "click.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "button", ty = "usize", value = "button" },
]
