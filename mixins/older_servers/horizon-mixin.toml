[mod]
id = "older_servers"
version = "1.0.0"
priority = 100

# Pinned: besides the native hook points it changes two functions of the
# client's connection code (`net::older_servers_enabled`, `net::older_server`)
# and one of the protocol's item reader (`item::older_layout`), which are not
# hook points. Re-check them before moving the pin.
[compatibility]
horizon_revision = "f319701e8c9ab657ff562250b3ba07b2d654e3bc"

# The picked version and the button's geometry, shared by the screen and the connection.
[[module]]
id = "state"
file = "crates/horizon-client/src/net.rs"
name = "older_servers_mod"
source = "state.rs"
visibility = "pub"

# Older servers are on without HORIZON_OLDER_SERVERS.
[[injection]]
id = "enabled"
kind = "HEAD"
cancellable = true
target = "horizon_client_lib::net::older_servers_enabled"
helper = "enabled.rs"
bindings = []

# The picked version, or the status ping on Auto.
[[injection]]
id = "server"
kind = "HEAD"
cancellable = true
target = "horizon_client_lib::net::older_server"
helper = "server.rs"
bindings = [
  { name = "address", ty = "&str", value = "address" },
]

# 1.21.11's EitherHolder item components (horizon-rust/horizon#9752).
[[injection]]
id = "either"
kind = "HEAD"
cancellable = true
target = "horizon_protocol::item::older_layout"
helper = "either.rs"
bindings = [
  { name = "kind", ty = "i32", value = "kind" },
  { name = "r", ty = "&mut Reader", value = "&mut *r" },
]

[[injection]]
id = "frame"
hook = "frame"
hook_version = 1
kind = "HEAD"
helper = "frame.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

# The version button on the Multiplayer screen.
[[injection]]
id = "screen"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_screen_render_post"
helper = "screen.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "batch", ty = "&mut horizon_client::hud::HudBatch", value = "&mut *batch" },
  { name = "screen", ty = "&crate::game::native_hooks::NativeScreenView<'_>", value = "screen" },
]

[[injection]]
id = "mouse"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_screen_mouse_button_pressed_pre"
helper = "mouse.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "screen", ty = "&crate::game::native_hooks::NativeScreenView<'_>", value = "screen" },
  { name = "button", ty = "i32", value = "button" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

[[injection]]
id = "list"
hook = "mods"
hook_version = 1
kind = "HEAD"
helper = "list.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]
